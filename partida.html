<!DOCTYPE html>
<html>
<head>

    <style>

            min-height: 100vh;

        .container {

            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        #svg-display {
            max-width: 90vw;
            max-height: 85vh;
        }
        .controls {
            margin-top: 0px;
        }
        button {
            font-size: 32px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .info {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

        function goToFirst() {

        }
        
        function goToPrev() {
            if (currentIndex > 0) {

            }
        }
        
        function goToNext() {
            if (currentIndex < svgPaths.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        }
        
        function goToLast() {
            currentIndex = svgPaths.length - 1;

        }
        
        // Initialize on page load
        updateDisplay();

</body>
</html>
